<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Memory Scrapbook ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            background-color: #000;
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            z-index: -2;
            object-fit: contain;
            background-color: transparent;
            transition: filter 0.5s ease;
        }

        .bg-blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            backdrop-filter: blur(2.5px);
            -webkit-backdrop-filter: blur(2.5px);
            background: rgba(0, 0, 0, 0.15);
            z-index: -1;
            transition: opacity 0.5s ease;
        }

        .glass-box {
            position: absolute;
            bottom: 25px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 14px 18px;
            border-radius: 18px;
            width: 85%;
            max-width: 310px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        h2 { font-family: 'Caveat', cursive; font-size: 1.5rem; margin: 0 0 2px 0; color: #ffeb3b; }
        p { font-size: 0.82rem; line-height: 1.3; color: #f0f0f0; margin: 4px 0; }

        input, textarea {
            width: 90%;
            padding: 6px 12px;
            margin: 6px 0;
            border-radius: 20px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 0.82rem;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
        }
        textarea { border-radius: 12px; text-align: left; height: 65px; padding: 8px; }
        
        button {
            background: linear-gradient(45deg, #ff4081, #ff79b0);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 4px;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.4);
        }
        button:hover { transform: scale(1.05); box-shadow: 0 6px 14px rgba(255, 64, 129, 0.6); }

        .hidden { display: none !important; }

        #main-scrapbook {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0 20px 0;
            z-index: 5;
            animation: fadeIn 0.8s ease-in-out;
        }

        .header-title {
            background: rgba(15, 15, 15, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 22px;
            border-radius: 20px;
            color: #fff;
            font-size: 1.3rem;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 6;
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slide-screen img, .slide-screen video {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95vw;
            height: 85vh;
            max-width: 700px;
            max-height: 750px;
            object-fit: contain;
            border-radius: 16px;
            border: none !important;
            outline: none !important;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            animation: imgEnter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), floatSoft 4s ease-in-out infinite alternate 0.7s;
        }

        .slider-nav {
            position: absolute;
            bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 330px;
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(10px);
            padding: 5px 12px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            z-index: 6;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slider-nav button {
            background: linear-gradient(45deg, #ff4081, #ff79b0);
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            padding: 5px 14px;
            font-size: 0.75rem;
            margin: 0;
        }

        @keyframes popUp {
            from { opacity: 0; transform: translateY(30px) scale(0.85); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes imgEnter {
            0% {
                opacity: 0;
                transform: translate(-50%, -45%) scale(0.82) rotate(-2deg);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                filter: blur(0px);
            }
        }

        @keyframes floatSoft {
            0% {
                transform: translate(-50%, -50%) translateY(0px) scale(1);
                box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            }
            50% {
                transform: translate(-50%, -50%) translateY(-8px) scale(1.015);
                box-shadow: 0 18px 35px rgba(255, 64, 129, 0.3);
            }
            100% {
                transform: translate(-50%, -50%) translateY(4px) scale(0.99);
                box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            }
        }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="1.mp4" type="video/mp4">
    </video>

    <div id="blur-overlay" class="bg-blur-overlay hidden"></div>

    <audio id="bg-music" loop preload="auto">
        <source src="Akbar Chalay, Mingse - Astaga Bercanda (Lyrics) (1).mp3" type="audio/mpeg">
    </audio>

    <!-- TOMBOL PEMBUKA UTAMA AGAR AUDIO BISA AUTOPLAY DI HALAMAN SELAMAT DATANG -->
    <div id="start-overlay" class="glass-box" style="z-index: 99;">
        <h2>Yooo</h2>
        <p>Klik tombol di bawah untuk membuka halaman!</p>
        <button onclick="playMusicAndShowWelcome()">🎵 Klik</button>
    </div>

    <!-- HALAMAN LOGIN (SELAMAT DATANG) -->
    <div id="login-page" class="glass-box hidden">
        <h2>Selamat Datang! ✨</h2>
        <p>Hi Namanya siapa ?</p>
        <input type="text" id="username" placeholder="">
        <br>
        <button onclick="startApp()">Masuk</button>
    </div>

    <div id="quiz-page" class="glass-box hidden">
        <h2>Tebak-tebakan Dulu! 🤔</h2>
        <p id="quiz-question">Pertanyaan akan muncul di sini...</p>
        <input type="text" id="quiz-ans" placeholder="jawaban...">
        <br>
        <button onclick="checkQuizAnswer()">Kirim Jawaban 🚀</button>
    </div>

    <div id="main-scrapbook" class="hidden">
        <h2 class="header-title">Our Sweet Journey 📸</h2>
        
        <div id="slider-content" class="slide-screen">
        </div>

        <div class="slider-nav">
            <button onclick="prevSlide()">❮ Prev</button>
            <span id="slide-counter" style="color: #fff; font-weight: bold; font-size: 0.85rem;">1 / 12</span>
            <button onclick="nextSlide()">Next ❯</button>
        </div>
    </div>

    <div id="letter-page" class="glass-box hidden">
        <h2>💌</h2>
        <p style="text-align: left; background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 8px; font-size: 0.78rem; color: #fff;">
            Terima kasih sudah melihat semua ini sampe akhir, BISMILLAH NOMER WA!!!! Tulis balasanmu di bawah ya: 👇
        </p>
        <textarea id="reply-msg" placeholder=""></textarea>
        <br>
        <button onclick="sendReply()">Kirim Balasan 🚀</button>
    </div>

    <script>
        const waPhoneNumber = "+6285591268582";

        // Detik lagu dimulai (Detik 30)
        const reffStartTimeInSeconds = 30;

        const mediaData = [
            { type: 'img', src: '2.jpg' },
            { type: 'video', src: '1.mp4' },
            { type: 'img', src: '3.jpg' },
            { type: 'video', src: '5.mp4' },
            { type: 'img', src: '4.jpg' },
            { type: 'video', src: '10.mp4' },
            { type: 'img', src: '6.jpg' },
            { type: 'img', src: '7.jpg' },
            { type: 'img', src: '8.jpg' },
            { type: 'img', src: '9.jpg' },
            { type: 'img', src: '11.jpg' },
            { type: 'img', src: '12.jpg' }
        ];

        // TEBAK-TEBAKAN BARU DI-UPDATE DI SINI
        let quizCheckpoints = {
            2: { q: "Hewan apa yang hurufnya 2?", a: ["udang"], bg: "10.mp4" },
            6: { q: "Hewan apa yang hurufnya 1?", a: ["g ajah", "gajah", "i kan", "ikan"], bg: "1.mp4" },
            10: { q: "Berapa hasil dari: 200 x 3000 + 9000 : 2457 + 1 ?", a: ["600004", "600005"], bg: "5.mp4" }
        };

        let currentSlide = 0;
        let userName = "";
        let activeQuizIndex = 0;

        // FUNGSI UNTUK MEMUTAR AUDIO DI DETIK KE-30 DAN TAMPILKAN "SELAMAT DATANG"
        function playMusicAndShowWelcome() {
            let music = document.getElementById('bg-music');
            music.currentTime = reffStartTimeInSeconds; // Set ke detik 30
            
            music.play().then(() => {
                document.getElementById('start-overlay').classList.add('hidden');
                document.getElementById('login-page').classList.remove('hidden');
            }).catch(error => {
                console.log("Autoplay dilarang browser:", error);
            });
        }

        function changeBgVideo(videoFileName) {
            let videoElement = document.getElementById('bg-video');
            videoElement.src = videoFileName;
            videoElement.load();
        }

        function setBackgroundBlur(isBlurred) {
            let overlay = document.getElementById('blur-overlay');
            if (isBlurred) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function startApp() {
            userName = document.getElementById('username').value;
            if(userName.trim() === "") {
                alert("Tulis namanya dulu ya!");
                return;
            }

            changeBgVideo('10.mp4'); 
            setBackgroundBlur(true);
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('main-scrapbook').classList.remove('hidden');
            renderSlide();
        }

        function renderSlide() {
            let container = document.getElementById('slider-content');
            let counter = document.getElementById('slide-counter');
            
            if (currentSlide >= mediaData.length) {
                changeBgVideo('1.mp4');
                setBackgroundBlur(false);
                document.getElementById('main-scrapbook').classList.add('hidden');
                document.getElementById('letter-page').classList.remove('hidden');
                return;
            }

            let item = mediaData[currentSlide];
            counter.innerText = (currentSlide + 1) + " / " + mediaData.length;

            if (item.type === 'img') {
                container.innerHTML = `
                    <img src="${item.src}" alt="Foto Kenangan" key="${currentSlide}">
                `;
            } else {
                container.innerHTML = `
                    <video autoplay muted loop playsinline key="${currentSlide}">
                        <source src="${item.src}" type="video/mp4">
                        Video tidak didukung browser kamu.
                    </video>
                `;
            }
        }

        function nextSlide() {
            if (quizCheckpoints.hasOwnProperty(currentSlide)) {
                triggerQuiz(currentSlide);
                return;
            }
            currentSlide++;
            renderSlide();
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        function triggerQuiz(slideIdx) {
            activeQuizIndex = slideIdx;
            
            let bgToUse = quizCheckpoints[slideIdx].bg || '1.mp4';
            changeBgVideo(bgToUse);
            setBackgroundBlur(false);
            
            document.getElementById('main-scrapbook').classList.add('hidden');
            document.getElementById('quiz-question').innerText = quizCheckpoints[slideIdx].q;
            document.getElementById('quiz-ans').value = "";
            document.getElementById('quiz-page').classList.remove('hidden');
        }

        function checkQuizAnswer() {
            let userAns = document.getElementById('quiz-ans').value.toLowerCase().trim();
            let validAnswers = quizCheckpoints[activeQuizIndex].a;

            let isCorrect = validAnswers.some(ans => userAns.includes(ans));

            if (isCorrect) {
                alert("Yeay, jawaban kamu benar! 🎉 Lanjut ke memori berikutnya ya.");
                
                delete quizCheckpoints[activeQuizIndex];

                document.getElementById('quiz-page').classList.add('hidden');
                document.getElementById('main-scrapbook').classList.remove('hidden');
                
                changeBgVideo('10.mp4');
                setBackgroundBlur(true);
                
                currentSlide++;
                renderSlide();
            } else {
                alert("Hmm, kurang tepat nih. Coba ingat-ingat lagi ya! 😉");
            }
        }

        function sendReply() {
            let msg = document.getElementById('reply-msg').value;
            if(msg.trim() === "") {
                alert("Tulis dulu balasannya ya sebelum dikirim!");
                return;
            }
            let encodedMsg = encodeURIComponent(`Halo, ini balasan dari ${userName}:\n\n${msg}`);
            window.open(`https://wa.me/${waPhoneNumber}?text=${encodedMsg}`, '_blank');
        }
    </script>
</body>
</html>
